---
openapi: 3.0.3
info:
  title: DNRE API
  contact:
    name: e-Fatura
    url: https://efatura.cv
    email: helpdesk@efatura.cv
  license:
    name: Termos de Uso
    url: https://efatura.cv
  version: 2.0.0
externalDocs:
  description: Manual Técnico
  url: https://efatura.cv/docs/manual
tags:
- name: DNRE OPACC
  description: Recurso para interagir com OPACC.
- name: DNRE TAXPAYER/USER
  description: Recurso para interagir com contribuintes/utilizadores.
- name: EFATURA DATA
  description: Recurso para obter informações básicas da Plataforma Eletrónica.
- name: EFATURA DFE
  description: Recurso para interagir com DFEs.
- name: EFATURA DIGITAL CERTIFICATE
  description: Recurso para interagir com certificados digitais.
- name: EFATURA EVENT
  description: Recurso para interagir com eventos.
- name: EFATURA LED
  description: Recurso para interagir com LEDs.
- name: EFATURA SOFTWARE
  description: Recurso para interagir com software.
paths:
  /v1/certificate/keystore:
    get:
      tags:
      - EFATURA DIGITAL CERTIFICATE
      summary: Consulta de keystore.
      operationId: DigitalCertificateResource_getKeystore
      parameters:
      - name: UseType
        in: query
        description: "Tipo de Uso de Certificado: SIGN=Assinatura Qualificada; TLS=Autenticaç\
          ão TLS Mútua."
        required: true
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        description: "Código de Repositório: 1-Principal; 2-Homologação; 3-Teste."
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_cert_read
  /v1/data/pe-date-time:
    get:
      tags:
      - EFATURA DATA
      summary: Devolve a data/hora atual da Plataforma Eletrónica.
      operationId: PublicDataResource_getPeDateTime
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
  /v1/dfe:
    get:
      tags:
      - EFATURA DFE
      summary: Lista de DFEs limitada em 10000 DFEs.
      operationId: DfeResource_getDfeSummaryListV1
      parameters:
      - name: AuthorizedDateEnd
        in: query
        schema:
          type: string
      - name: AuthorizedDateStart
        in: query
        schema:
          type: string
      - name: DocumentNumber
        in: query
        schema:
          type: string
      - name: DocumentTypeCodes
        in: query
        schema:
          type: string
      - name: EmitterTaxId
        in: query
        schema:
          type: string
      - name: IUD
        in: query
        schema:
          type: string
      - name: IsCanceled
        in: query
        schema:
          type: string
      - name: IssueDirection
        in: query
        schema:
          type: string
      - name: IssueYear
        in: query
        schema:
          type: string
      - name: LedCode
        in: query
        schema:
          type: string
      - name: ReceiverTaxId
        in: query
        schema:
          type: string
      - name: ReceiverTaxIdCountryCode
        in: query
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DfeListProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DfeListProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_read_list
    post:
      tags:
      - EFATURA DFE
      summary: Comunicação de novos DFEs.
      operationId: DfeResource_createDfe
      parameters:
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  format: binary
                  type: string
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/EfEntriesProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EfEntriesProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_create
    delete:
      tags:
      - EFATURA DFE
      summary: Elimina todos os DFEs e os respetivos eventos no repositório de Homologação/Teste.
      operationId: DfeResource_deleteDfeAndEvent
      parameters:
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseLong'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseLong'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_delete
  /v1/dfe/new:
    get:
      tags:
      - EFATURA DFE
      summary: "Gera um template de DFE com alguns campos preenchidos, incluindo o\
        \ IUD."
      operationId: DfeResource_getNewDfe
      parameters:
      - name: DocumentNumber
        in: query
        schema:
          type: string
      - name: DocumentTypeCode
        in: query
        schema:
          type: string
      - name: IsSelfBilling
        in: query
        schema:
          type: string
      - name: IssueDate
        in: query
        schema:
          type: string
      - name: IssueTime
        in: query
        schema:
          type: string
      - name: LedCode
        in: query
        schema:
          type: string
      - name: OtherPartyTaxId
        in: query
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseDfe'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseDfe'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_create
  /v1/dfe/pdf/{Id}:
    get:
      tags:
      - EFATURA DFE
      summary: Consulta de PDF de um DFE com IUD.
      operationId: DfeResource_getDfePdfById
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_read_iud
  /v1/dfe/self-billing/authorize:
    post:
      tags:
      - EFATURA DFE
      summary: Pedido de autorização para autofaturação.
      operationId: DfeResource_authorizeSelfBilling
      parameters:
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DfeSelfBillingAuthorizeRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseDfeSelfBillingAuthorizeResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_self_billing_authorize
  /v1/dfe/xml/{Id}:
    get:
      tags:
      - EFATURA DFE
      summary: Consulta de XML com IUD exatamente como foi gerado e assinado pelo
        contribuinte e com aposição de timestamp.
      operationId: DfeResource_getDfeXmlById
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_read_iud
  /v1/dfe/{Id}:
    get:
      tags:
      - EFATURA DFE
      summary: Consulta de DFE com IUD.
      operationId: DfeResource_getDfeById
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseDfe'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseDfe'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_dfe_read_iud
  /v1/event:
    get:
      tags:
      - EFATURA EVENT
      summary: Lista de eventos limitada em 10000 eventos.
      operationId: EventResource_getEventListV1
      parameters:
      - name: AuthorizedDateEnd
        in: query
        schema:
          type: string
      - name: AuthorizedDateStart
        in: query
        schema:
          type: string
      - name: DocumentNumberEnd
        in: query
        schema:
          type: string
      - name: DocumentNumberStart
        in: query
        schema:
          type: string
      - name: DocumentTypeCodes
        in: query
        schema:
          type: string
      - name: EventId
        in: query
        schema:
          type: string
      - name: EventTypeCodes
        in: query
        schema:
          type: string
      - name: IUD
        in: query
        schema:
          type: string
      - name: LedCode
        in: query
        schema:
          type: string
      - name: Year
        in: query
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/EventListProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EventListProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_event_read
    post:
      tags:
      - EFATURA EVENT
      summary: Comunicação de novos eventos.
      operationId: EventResource_createEvent
      parameters:
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  format: binary
                  type: string
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/EfEntriesProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EfEntriesProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_event_create
  /v1/event/xml/{Id}:
    get:
      tags:
      - EFATURA EVENT
      summary: Consulta de XML de evento com ID.
      operationId: EventResource_getEventXmlById
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadStringProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_event_read
  /v1/event/{Id}:
    get:
      tags:
      - EFATURA EVENT
      summary: Consulta de evento com ID.
      operationId: EventResource_getEventById
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      - name: cv-ef-repository-code
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseEvent'
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseEvent'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_event_read
  /v1/led:
    get:
      tags:
      - EFATURA LED
      summary: Lista de LEDs.
      operationId: LedResource_getAllLeds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseListLedDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseListLedDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_led_read
    post:
      tags:
      - EFATURA LED
      summary: Regista uma nova LED.
      operationId: LedResource_createLed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLedDto'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseLedDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_led_create
  /v1/led/{LedCode}:
    get:
      tags:
      - EFATURA LED
      summary: Consulta de LED com código.
      operationId: LedResource_getLedByCode
      parameters:
      - name: LedCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseLedDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_led_read
    put:
      tags:
      - EFATURA LED
      summary: Atualiza uma LED.
      operationId: LedResource_updateLed
      parameters:
      - name: LedCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLedDto'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseLedDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_led_update
    delete:
      tags:
      - EFATURA LED
      summary: Elimina uma LED sem DFEs associados.
      operationId: LedResource_deleteLed
      parameters:
      - name: LedCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseBoolean'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_led_delete
  /v1/opacc/accountant-customer:
    get:
      tags:
      - DNRE OPACC
      summary: Lista de contribuintes que são clientes do contabilista certificado
        representado pelo utilizador autenticado.
      operationId: OpaccResource_getAccountantCustomers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseListOpaccAccountantCustomerDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme: []
    post:
      tags:
      - DNRE OPACC
      summary: Regista um contribuinte como um cliente de um contabilista certificado.
      operationId: OpaccResource_createAccountantCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpaccAccountantCustomerCreateDto'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseOpaccAccountantCustomerDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme: []
  /v1/opacc/accountant-customer/{CustomerId}:
    delete:
      tags:
      - DNRE OPACC
      summary: Elimina um contribuinte como um cliente de um contabilista certificado.
      operationId: OpaccResource_deleteAccountantCustomer
      parameters:
      - name: CustomerId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme: []
  /v1/opacc/accountant-list:
    get:
      tags:
      - DNRE OPACC
      summary: Lista Nacional de Auditores e Contabilistas Certificados Autorizados.
      operationId: OpaccResource_getAccountants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseListOpaccAccountantDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_opacc_read_accountant_list
    post:
      tags:
      - DNRE OPACC
      summary: Carrega na PE a Lista Nacional de Auditores e Contabilistas Certificados
        Autorizados.
      operationId: OpaccResource_uploadAccountants
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  format: binary
                  type: string
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingResponse'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_opacc_upload_accountant_list
  /v1/software:
    get:
      tags:
      - EFATURA SOFTWARE
      summary: Lista de aplicações (software) de faturação/transmissão registadas
        na Plataforma Eletrónica.
      operationId: SoftwareResource_readSoftwareThatAuthUserCanSee
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseListSoftwareDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_sw_read_list
  /v1/software/customer:
    get:
      tags:
      - EFATURA SOFTWARE
      summary: Lista contribuintes clientes de software.
      operationId: SoftwareResource_readSoftwareCustomerList
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseListSoftwareCustomerDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_sw_ctm_read
    post:
      tags:
      - EFATURA SOFTWARE
      summary: Regista um novo contribuinte cliente de software.
      operationId: SoftwareResource_createSoftwareCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftwareCustomerEntity'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseSoftwareCustomerEntity'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_sw_ctm_create
  /v1/software/customer/{Id}:
    get:
      tags:
      - EFATURA SOFTWARE
      summary: Consulta contribuinte cliente de software com ID.
      operationId: SoftwareResource_readSoftwareCustomerById
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseSoftwareCustomerDto'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_sw_ctm_read
    put:
      tags:
      - EFATURA SOFTWARE
      summary: Atualiza um contribuinte cliente de software.
      operationId: SoftwareResource_updateSoftwareCustomer
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftwareCustomerEntity'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseSoftwareCustomerEntity'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_sw_ctm_update
    delete:
      tags:
      - EFATURA SOFTWARE
      summary: Elimina um contribuinte cliente de software.
      operationId: SoftwareResource_deleteSoftwareCustomer
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseBoolean'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - cv_ef_sw_ctm_delete
  /v1/software/customer/{Id}/enabled:
    put:
      tags:
      - EFATURA SOFTWARE
      summary: Ativa/Desativa um contribuinte cliente de software.
      operationId: SoftwareResource_updateSoftwareCustomerEnabled
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftwareCustomerEntity'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadProcessingResponseSoftwareCustomerEntity'
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
